# CI/CD NouraSchool Backend
# Pipeline : validate -> build/push Docker Hub -> deploy via Coolify webhook

name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: nouraschool-backend-nestjs

jobs:

  # ── 1. Validation ────────────────────────────────────────────────────────────
  validate:
    name: Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Build NestJS
        run: npm run build
        env:
          NODE_ENV: production

  # ── 2. Build & push image Docker Hub ─────────────────────────────────────────
  docker:
    name: Build Docker image
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker metadata
        if: github.event_name == 'push'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=prod
            type=raw,value=latest

      - name: Login to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build image (pull request — no push)
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: ${{ env.IMAGE_NAME }}:pr-${{ github.event.pull_request.number }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push image
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── 3. Deploy via Coolify ─────────────────────────────────────────────────────
  deploy:
    name: Deploy to Coolify
    needs: docker
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Trigger deployment
        env:
          COOLIFY_WEBHOOK: ${{ secrets.COOLIFY_WEBHOOK || secrets.WEBHOOK_URL }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN || secrets.WEBHOOK_TOKEN }}
        run: |
          if [ -z "$COOLIFY_WEBHOOK" ]; then
            echo "COOLIFY_WEBHOOK is not configured. Add COOLIFY_WEBHOOK in GitHub Actions secrets."
            exit 1
          fi
          if [ -n "$COOLIFY_TOKEN" ]; then
            echo "Triggering Coolify deployment with bearer token..."
            status=$(curl --silent --show-error --output /tmp/coolify-response.txt --write-out "%{http_code}" \
              --request GET "$COOLIFY_WEBHOOK" \
              --header "Authorization: Bearer $COOLIFY_TOKEN" \
              --header "Content-Type: application/json")
            if [ "$status" = "403" ]; then
              echo "Coolify returned 403 with bearer token. Check that the API token has '*' permission and belongs to the same Coolify team as the resource."
              status=$(curl --silent --show-error --output /tmp/coolify-response.txt --write-out "%{http_code}" \
                --request GET "$COOLIFY_WEBHOOK" \
                --header "Content-Type: application/json")
            fi
            cat /tmp/coolify-response.txt || true
            if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
              echo "Coolify deployment trigger failed with HTTP $status"
              exit 1
            fi
          else
            echo "Triggering Coolify deployment with webhook URL..."
            curl --fail --request GET "$COOLIFY_WEBHOOK" \
              --header "Content-Type: application/json"
          fi
