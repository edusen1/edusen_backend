version: '3.9'

# Services dev : PostgreSQL + Redis + MinIO
# L'API tourne en local avec "npm run dev"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - '5433:5432'
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: nouraschool
    volumes:
      - pgdata_dev:/var/lib/postgresql/data

  # Redis deja disponible sur le host (redis-whatsapp sur port 6379)
  # REDIS_URL=redis://localhost:6379 dans le .env suffit

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    ports:
      - '9000:9000'   # API S3
      - '9001:9001'   # Console web  →  http://localhost:9001
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

  # Crée automatiquement le bucket au démarrage
  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
        sleep 3 &&
        mc alias set local http://minio:9000 minioadmin minioadmin &&
        mc mb --ignore-existing local/noura-school-files &&
        mc anonymous set download local/noura-school-files
      "

volumes:
  pgdata_dev:
  minio_data:
